services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
  functions:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/coffeenchill-functions:v2.0
    ports:
      - "8080:80"
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      AzureWebJobsStorage: ${AZURITE_CONNECTION_STRING:?Set AZURITE_CONNECTION_STRING in .env}
    depends_on:
      - azurite
    restart: unless-stopped
volumes:
  azurite-data:
